<!doctype html>
<!--
  S6.1 (2026-05-27) — Screen-capture source picker.

  Modal BrowserWindow that opens after the folder picker on Listen click.
  User picks one window or screen, click resolves it back to main via
  window.api.brain.pickerConfirm(...). Cancel button resolves with null.

  Uses Glass's standard preload (contextIsolation: true) — no
  nodeIntegration, no fs access. All data flows through window.api.brain.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pick capture source</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181820;
        --panel: #222230;
        --panel-hover: #2a2a3a;
        --panel-active: #3a3a5a;
        --border: rgba(255, 255, 255, 0.08);
        --border-active: #7aa2f7;
        --text: #e5e5e7;
        --muted: rgba(229, 229, 231, 0.6);
        --accent: #7aa2f7;
        --button-bg: rgba(255, 255, 255, 0.08);
        --button-bg-hover: rgba(255, 255, 255, 0.14);
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: 0 0 auto;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      header .hint {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 16px;
      }
      .group-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 6px 4px 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tile:hover {
        background: var(--panel-hover);
      }
      .tile.selected {
        background: var(--panel-active);
        border-color: var(--border-active);
      }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0a0a10;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .thumb .placeholder {
        color: var(--muted);
        font-size: 11px;
      }
      .name {
        font-size: 12px;
        line-height: 1.35;
        word-break: break-word;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .name img.icon {
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }
      footer {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
      }
      footer .status {
        color: var(--muted);
        font-size: 12px;
      }
      .btn {
        background: var(--button-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover {
        background: var(--button-bg-hover);
      }
      .btn.primary {
        background: var(--accent);
        color: #0a0a10;
        border-color: var(--accent);
      }
      .btn.primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pick the window or screen to capture</h1>
      <div class="hint">Glass will sample one JPEG every 5s for Agent F.</div>
    </header>

    <main id="main">
      <div class="empty" id="loading">Loading sources…</div>
    </main>

    <footer>
      <div class="status" id="status">Click a tile, then "Use this", or Cancel for audio-only.</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" id="cancel-btn">Cancel</button>
        <button class="btn primary" id="confirm-btn" disabled>Use this</button>
      </div>
    </footer>

    <script>
      let selected = null;
      let allSources = [];

      const mainEl = document.getElementById('main');
      const confirmBtn = document.getElementById('confirm-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const statusEl = document.getElementById('status');

      function renderTile(source) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.id = source.id;

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        if (source.thumbnailDataUrl) {
          const img = document.createElement('img');
          img.src = source.thumbnailDataUrl;
          img.alt = source.name;
          thumb.appendChild(img);
        } else {
          const ph = document.createElement('span');
          ph.className = 'placeholder';
          ph.textContent = '(no preview)';
          thumb.appendChild(ph);
        }

        const name = document.createElement('div');
        name.className = 'name';
        if (source.appIconDataUrl) {
          const icon = document.createElement('img');
          icon.className = 'icon';
          icon.src = source.appIconDataUrl;
          name.appendChild(icon);
        }
        const nameText = document.createElement('span');
        nameText.textContent = source.name;
        name.appendChild(nameText);

        tile.appendChild(thumb);
        tile.appendChild(name);

        tile.addEventListener('click', () => {
          document.querySelectorAll('.tile.selected').forEach((el) => el.classList.remove('selected'));
          tile.classList.add('selected');
          selected = { id: source.id, name: source.name };
          confirmBtn.disabled = false;
          statusEl.textContent = `Selected: ${source.name}`;
        });
        tile.addEventListener('dblclick', () => {
          selected = { id: source.id, name: source.name };
          confirm();
        });

        return tile;
      }

      function renderList(sources) {
        mainEl.innerHTML = '';
        if (sources.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No capture sources found.';
          mainEl.appendChild(empty);
          return;
        }

        const screens = sources.filter((s) => s.kind === 'screen');
        const windows = sources.filter((s) => s.kind === 'window');

        if (screens.length > 0) {
          const label = document.createElement('div');
          label.className = 'group-label';
          label.textContent = 'Screens';
          mainEl.appendChild(label);
          const grid = document.createElement('div');
          grid.className = 'grid';
          screens.forEach((s) => grid.appendChild(renderTile(s)));
          mainEl.appendChild(grid);
        }
        if (windows.length > 0) {
          const label = document.createElement('div');
          label.className = 'group-label';
          label.textContent = 'Windows';
          mainEl.appendChild(label);
          const grid = document.createElement('div');
          grid.className = 'grid';
          windows.forEach((s) => grid.appendChild(renderTile(s)));
          mainEl.appendChild(grid);
        }
      }

      async function confirm() {
        if (!selected) return;
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        try {
          await window.api.brain.pickerConfirm(selected);
        } catch (e) {
          console.error('pickerConfirm failed', e);
        }
      }

      async function cancel() {
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        try {
          await window.api.brain.pickerCancel();
        } catch (e) {
          console.error('pickerCancel failed', e);
        }
      }

      confirmBtn.addEventListener('click', confirm);
      cancelBtn.addEventListener('click', cancel);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') cancel();
        if (e.key === 'Enter' && selected) confirm();
      });

      // Boot.
      (async () => {
        try {
          if (!window.api?.brain?.listCaptureWindows) {
            statusEl.textContent = 'preload not wired — window.api.brain missing';
            return;
          }
          allSources = await window.api.brain.listCaptureWindows();
          renderList(allSources);
        } catch (e) {
          mainEl.innerHTML = '';
          const err = document.createElement('div');
          err.className = 'empty';
          err.textContent = 'Failed to load sources: ' + e.message;
          mainEl.appendChild(err);
        }
      })();
    </script>
  </body>
</html>
